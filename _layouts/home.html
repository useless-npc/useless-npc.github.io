---
layout: default
---
<section class="home-feed wrap" id="writeups">
  <header class="home-feed-header">
    <div>
      <p class="eyebrow">NPC</p>
      <h1>Security <em>blogs.</em></h1>
    </div>
    <p>CTF walkthroughs, exam reviews, and labs writeup.</p>
  </header>

  {% if site.posts.size > 0 %}
  <div class="home-card-grid">
    {% for post in site.posts %}
      {% include home-card.html post=post index=forloop.index %}
    {% endfor %}
  </div>
  {% else %}
  <p class="empty-state">No writeups published yet.</p>
  {% endif %}
</section>
