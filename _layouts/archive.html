---
layout: default
---
<section class="wrap archive-content">
  <div class="archive-tools">
    <label class="writeup-search"><span class="sr-only">Search writeups</span><span aria-hidden="true">&#9906;</span><input type="search" id="writeup-search" placeholder="Search writeups" autocomplete="off"></label>
  </div>
  <div class="home-card-grid archive-card-grid">{% for post in site.posts %}{% include home-card.html post=post index=forloop.index card_class='archive-card' %}{% endfor %}</div>
  <p class="empty-state" hidden>No writeups match your search.</p>
</section>
